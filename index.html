<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Auto Wala — Indian Auto Rickshaw Player | Horn OK Please</title>
    <meta
      name="description"
      content="Non-stop 90s & 2000s Bollywood highway bangers featuring an animated Indian Auto Rickshaw driving down the road. Press play. Horn OK Please."
    />
    <meta name="theme-color" content="#3a88e9" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Auto Wala" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="Auto Wala — Indian Auto Rickshaw" />
    <meta
      property="og:description"
      content="Highway and tapori bangers with an animated Indian Auto Rickshaw running on the road."
    />

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛺</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hind:wght@300;400;500;600;700&family=Kalam:wght@300;400;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="./styles.css?v=17" />
  </head>

  <body>
    <!-- Animated Daytime Highway Road & Auto Rickshaw Canvas -->
    <div class="bg" aria-hidden="true">
      <canvas id="roadCanvas"></canvas>
      <div class="bg__scrim"></div>
    </div>

    <!-- Hidden YouTube iframe — sound source -->
    <div class="yt-host" aria-hidden="true"><div id="yt-player"></div></div>

    <!-- ── Top bar ─────────────────────────────────────────────── -->
    <header class="topbar">
      <div class="clock" id="clock" aria-label="Current time"></div>

      <div class="presence" aria-live="polite">
        <span class="presence__dot" aria-hidden="true"></span>
        <span class="presence__count" id="listeners">52</span>
        <span class="presence__label">on the highway</span>
      </div>

      <nav class="links" aria-label="Instagram profile">
        <a
          class="link"
          id="link-ig"
          href="https://www.instagram.com/mr.m.ux?igsh=MWE2em14aTFsMTN5Mw%3D%3D&utm_source=qr"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Follow mr.m.ux on Instagram"
          title="Follow @mr.m.ux on Instagram"
        >
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
            <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
          </svg>
        </a>
      </nav>
    </header>

    <!-- ── Horn ──────────────────────────────────────────────────── -->
    <aside class="horns">
      <button class="horn" id="horn" type="button" aria-label="Sound the horn">
        <span class="horn__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path fill="currentColor" d="M3 9v6h4l5 4V5L7 9H3z" />
            <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <path d="M15.4 8.4a5.2 5.2 0 010 7.2" />
              <path d="M18.2 5.6a9.2 9.2 0 010 12.8" />
            </g>
          </svg>
        </span>
        <span class="horn__text">
          <span class="horn__deva" lang="hi">हॉर्न ओके प्लीज़</span>
          <span class="horn__en">Horn ok pleaseeee</span>
        </span>
      </button>
    </aside>

    <!-- ── Single-Line Wordmark Logo (Kalam Font) ────────────────── -->
    <h1 class="logo" lang="hi">
      <span class="logo__line">ऑटो वाला</span>
      <span class="sr-only" lang="en">Auto Wala — Horn OK Please</span>
    </h1>

    <!-- ── Centered Player Dock ────────────────────────────────── -->
    <div class="dock">
      <section class="list" id="list" aria-label="Playlist">
        <ol id="listItems"></ol>
      </section>

      <p class="bumper">
        <span class="bumper__text" id="bumperText" lang="hi" aria-live="polite"
          >ऑटो वाला!</span
        ><button class="bumper__next" id="bumperNext" type="button" aria-label="Another line">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 11.5A8 8 0 106.3 17.7" />
            <path d="M20 5.5v6h-6" />
          </svg>
        </button>
      </p>

      <section class="player" id="player" aria-label="Player">
        <div class="disc" id="disc">
          <div class="disc__ring">
            <img id="cover" class="disc__art" alt="" src="" />
          </div>
          <span class="disc__hub" aria-hidden="true"></span>
        </div>

        <div class="meta">
          <p class="meta__title" id="title">Loading playlist…</p>
          <p class="meta__artist" id="artist">&nbsp;</p>

          <div
            class="seek"
            id="seek"
            role="slider"
            tabindex="0"
            aria-label="Seek"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          >
            <div class="seek__rail"><div class="seek__fill" id="seekFill"></div></div>
            <div class="seek__knob" id="seekKnob"></div>
          </div>
          <div class="time"><span id="tCur">0:00</span> / <span id="tDur">0:00</span></div>
        </div>

        <div class="controls">
          <button id="shuffle" type="button" class="btn btn--toggle is-on" aria-label="Shuffle" aria-pressed="true">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor" aria-hidden="true">
              <path
                d="M17 3l4 4-4 4V8h-2.2l-2.3 3.1 2.3 3.1H17V11l4 4-4 4v-3h-3.2l-2.6-3.5L8.6 15H3v-2h4.6l2.6-3.5L12.8 6H17V3zM3 9h3.4l1.5 2H3V9z"
              />
            </svg>
          </button>
          <button id="prev" type="button" class="btn" aria-label="Previous track">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
              <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" />
            </svg>
          </button>
          <button id="play" type="button" class="btn btn--play" aria-label="Play" disabled>
            <svg class="i-play" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
              <path d="M8 5v14l11-7z" />
            </svg>
            <svg class="i-pause" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
              <path d="M6 5h4v14H6zm8 0h4v14h-4z" />
            </svg>
          </button>
          <button id="next" type="button" class="btn" aria-label="Next track">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
              <path d="M16 6h2v12h-2zm-2 6L5.5 6v12z" />
            </svg>
          </button>
          <button id="listBtn" type="button" class="btn btn--toggle" aria-label="Playlist" aria-expanded="false" aria-controls="list">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor" aria-hidden="true">
              <path d="M3 6h13v2H3zm0 5h13v2H3zm0 5h9v2H3zm15-6.5l4 3-4 3z" />
            </svg>
          </button>
        </div>
      </section>
    </div>

    <script src="./app.js?v=17"></script>
  </body>
</html>
